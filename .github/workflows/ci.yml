name: Validate Noval CRM
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/shipping-crm-foundation]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Commit updated lockfile on feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/shipping-crm-foundation'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize dependency lockfile"
            git push origin HEAD:feat/shipping-crm-foundation
          fi
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
