name: Validate Noval CRM
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/shipping-crm-foundation]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and install dependencies
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Upload updated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: resolved-package-lock
          path: package-lock.json
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
