name: Validate Noval CRM
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and verify lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
