name: Scaffold official shadcn/ui components
on:
  push:
    branches: [feat/shadcn-crm-ui]
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing dependencies
        run: npm ci
      - name: Install official shadcn components
        run: npx --yes shadcn@latest add card input textarea label badge table select dialog dropdown-menu sheet separator skeleton sonner tabs tooltip popover checkbox alert-dialog -y -o
      - name: Install enterprise table and chart dependencies
        run: npm install @tanstack/react-table recharts lucide-react
      - name: Commit generated components
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components app/globals.css package.json package-lock.json lib components.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate official shadcn base-ui components"
            git push origin HEAD:feat/shadcn-crm-ui
          fi
